<div class="sso-callback">

  <div class="sso-callback__card">

    <img
      src="assets/images/logos/Logo-RD.svg"
      alt="Realdooh"
      class="sso-callback__logo"
    >

    <div class="sso-callback__icono">

      <mat-icon>
        check_circle
      </mat-icon>

    </div>

    <h1 class="sso-callback__titulo">
      {{ textos.sso?.titulo }}
    </h1>

    <p class="sso-callback__mensaje">
      {{ mensaje }}
    </p>

    <a
      href="/login"
      class="sso-callback__volver"
    >
      {{ textos.sso?.volver }}
    </a>

  </div>

</div>
